name: sole_trader
description: A custom electrician estimate & invoice app for sole traders using Flutter and AWS Amplify.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Also add:
  # google_maps_flutter: any

  # AWS Amplify Core + Auth
  amplify_flutter: ^2.6.5
  amplify_auth_cognito: ^2.6.5

  # UI
  cupertino_icons: ^1.0.6

  # Image Picker and Google ML Kit
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: ^0.14.1
  google_mlkit_commons: ^0.11.0
  http: ^1.2.1

  # PDF and Printing (for PDF generation, not PDF reading)
  pdf: ^3.10.8
  printing: ^5.11.0
  syncfusion_flutter_pdf: ^30.2.5

  # URL Launcher
  url_launcher: ^6.2.6
  
  # HTTP and API integrations
  dio: ^5.4.0
  oauth2: ^2.0.2
  crypto: ^3.0.3
  json_annotation: ^4.8.1



  # Shared Preferences
  shared_preferences: ^2.2.2
  open_file: ^3.5.4
  
  # Local Database (Isar)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  # Firestore for cloud sync
  cloud_firestore: ^5.6.12
  
  # Connectivity checking
  connectivity_plus: ^6.0.5
  
  # Service locator
  get_it: ^8.0.2
  
  # Date formatting
  intl: ^0.20.2

  # CSV
  csv: ^6.0.0
  file_picker: ^10.2.3
  share_plus: ^11.0.0
  package_info_plus: ^8.3.0
  
  # Signature
  signature: ^5.4.0

  # Path Provider
  path_provider: ^2.1.2
  camera: ^0.11.0
  mobile_scanner: ^7.0.1
  simple_barcode_scanner: ^0.3.0

  drag_and_drop_lists: ^0.4.2

  # (Optional, for checking installed apps)
  # (Optional, for permissions)
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  mailer: ^6.5.0
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main
  flutter_colorpicker: ^1.0.3
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  speech_to_text: ^7.0.0
  geocoding: ^4.0.0
  # record: ^5.2.1  # Temporarily disabled due to Linux compatibility issues
  # googleapis_auth: ^1.4.1  # Only needed for cloud voice services
  # googleapis: ^13.2.0  # Only needed for cloud voice services
  # azure_cognitiveservices_speech: ^1.38.0  # Alternative cloud solution

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/certificates/COC EWRB NZ.pdf
    - assets/certificates/ESC EWRB NZ.pdf
    - assets/certificates/ROI EWRB NZ.pdf
    - assets/receipt_templates/
